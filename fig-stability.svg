    .margin { fill: none; stroke: #5b8cff; stroke-width: 2.4; stroke-linejoin: round; }
    .risk { fill: none; stroke: #ff6b6b; stroke-width: 2.4; stroke-linejoin: round; }
    .key { font: 11px 'JetBrains Mono', monospace; fill: currentColor; fill-opacity: 0.8; }
  </style>
  <line x1="52" y1="26.0" x2="668" y2="26.0" class="grid"/><line x1="52" y1="84.5" x2="668" y2="84.5" class="grid"/><line x1="52" y1="143.0" x2="668" y2="143.0" class="grid"/><line x1="52" y1="201.5" x2="668" y2="201.5" class="grid"/><line x1="52" y1="260.0" x2="668" y2="260.0" class="grid"/>
