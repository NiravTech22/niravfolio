  <line x1="52" y1="260" x2="668" y2="260" class="axis"/>
  <polyline class="margin" points="52.0,26.0 99.4,48.5 146.8,76.5 194.2,102.0 241.5,120.0 288.9,126.9 336.3,142.4 383.7,159.1 431.1,172.5 478.5,157.1 525.8,188.7 573.2,216.0 620.6,204.6 668.0,232.2"/>
  <polyline class="risk" points="52.0,249.4 99.4,219.0 146.8,176.3 194.2,133.8 241.5,109.5 288.9,79.1 336.3,64.9 383.7,57.5 431.1,33.0 478.5,55.2 525.8,33.0 573.2,33.0 620.6,33.0 668.0,33.0"/>
  <text x="52.0" y="286" class="tick" text-anchor="middle">0</text><text x="241.5" y="286" class="tick" text-anchor="middle">4</text><text x="431.1" y="286" class="tick" text-anchor="middle">8</text><text x="620.6" y="286" class="tick" text-anchor="middle">12</text>
